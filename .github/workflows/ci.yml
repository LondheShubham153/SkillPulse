name: CI


on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target branch'
        required: true
        default: 'inspect'
        type: choice
        options:
          - inspect
          - main 

permissions:
  contents: read
  id-token: write   # OIDC to AWS for Inspector

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-backend

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      # 1. Build into the local Docker daemon only — nothing pushed yet
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Scan with Amazon Inspector
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-to-assume: ${{ secrets.AWS_INSPECTOR_ROLE_ARN }}

      - name: Inspector scan
        id: inspector
        uses: aws-actions/vulnerability-scan-github-action-for-amazon-inspector@v1
        with:
          artifact_type: container
          artifact_path: ${{ env.IMAGE }}:${{ github.sha }}
          display_vulnerability_findings: disabled   # public repo, see note below
          critical_threshold: 1
          high_threshold: 1
          medium_threshold: 0
          low_threshold: 0
          other_threshold: 0

      # Optional: keep detailed reports private in S3 instead of public artifacts
      - name: Store reports privately
        if: always() && vars.INSPECTOR_REPORTS_BUCKET != '' && steps.inspector.outcome == 'success'
        run: |
          aws s3 cp "${{ steps.inspector.outputs.inspector_scan_results }}" \
            "s3://${{ vars.INSPECTOR_REPORTS_BUCKET }}/skillpulse/${{ github.sha }}/inspector-scan.json"
          aws s3 cp "${{ steps.inspector.outputs.inspector_scan_results_csv }}" \
            "s3://${{ vars.INSPECTOR_REPORTS_BUCKET }}/skillpulse/${{ github.sha }}/inspector-scan.csv"

      # 3. Gate: this sets the CI status (and therefore whether CD runs)
      - name: Fail if vulnerability thresholds exceeded
        run: |
          if [ "${{ steps.inspector.outputs.vulnerability_threshold_exceeded }}" != "0" ]; then
            echo "::error::Amazon Inspector found vulnerabilities above threshold. Image NOT pushed, deploy skipped."
            exit 1
          fi

      # 4. Push the exact image that was scanned (no rebuild)
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push scanned image
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker tag  "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:latest"
